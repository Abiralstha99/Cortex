services:
  backend:
    build: ./backend
    container_name: capital-rush-backend
    ports:
      - 3000:3000
    volumes:
    - ./backend:/app
    - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: capital-rush-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  
  redis:
    image: redis:7-alpine
    container_name: capital-rush-redis
    ports:
      - 6379:6379
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  redis-data: